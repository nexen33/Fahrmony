apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.fahrmony.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fahrmony.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // 自动重命名导出 APK 为 Fahrmony_v1.0.0.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Fahrmony_v${variant.versionName}.apk"
        }
    }

    def gradleHomeDir = project.gradle.gradleUserHomeDir
    def robolectricCacheDir = new File(gradleHomeDir, "robolectric")
    def testTmpDir = new File(gradleHomeDir, "tmp")

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                robolectricCacheDir.mkdirs()
                testTmpDir.mkdirs()
                maxHeapSize = "1024m"
                jvmArgs "-XX:+EnableDynamicAgentLoading"
                systemProperty "robolectric.dependency.dir", robolectricCacheDir.absolutePath
                systemProperty "robolectric.offline", "true"
                systemProperty "java.io.tmpdir", testTmpDir.absolutePath
            }
        }
    }
}

configurations {
    robolectricDeps
}

tasks.register('syncRobolectricDeps', Copy) {
    def robolectricCacheDir = new File(project.gradle.gradleUserHomeDir, "robolectric")
    from configurations.robolectricDeps
    into robolectricCacheDir
}

tasks.withType(Test).configureEach {
    dependsOn tasks.named('syncRobolectricDeps')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    def rVersion = rootProject.ext.has('robolectricVersion') ? rootProject.ext.robolectricVersion : '4.14.1'
    def mVersion = rootProject.ext.has('mockitoVersion') ? rootProject.ext.mockitoVersion : '5.14.2'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.media:media:1.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$rVersion"
    testImplementation "org.mockito:mockito-core:$mVersion"
    robolectricDeps "org.robolectric:android-all-instrumented:15-robolectric-12650502-i7"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
