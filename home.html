<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Fahrmony · In-Car Audio & IM Bridge for Android Auto</title>

  <!-- Typography: Exactly aligned with Fahrmony App design tokens -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <script>
    // 1. Synchronous Theme & Language Initialization
    (function () {
      try {
        var t = localStorage.getItem('fahrmony_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = t === 'dark' ? '#0a0c10' : '#f8fafc';
      } catch (e) { }
    })();
  </script>

  <style>
    :root {
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Color Tokens (Light Mode - Default) */
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-surface-glass: rgba(255, 255, 255, 0.85);
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-glass: rgba(0, 0, 0, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;

      --accent-primary: #0284c7;
      --accent-light: #0ea5e9;
      --accent-glow: rgba(2, 132, 199, 0.18);
      --accent-tint: rgba(2, 132, 199, 0.08);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 16px 36px -4px rgba(15, 23, 42, 0.07);
      --shadow-card: 0 12px 32px -4px rgba(15, 23, 42, 0.05);
      --shadow-pop: 0 24px 50px -10px rgba(15, 23, 42, 0.12);

      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.4, 0.64, 1);

      --navbar-top: 16px;
    }

    [data-theme="dark"] {
      --bg-main: #0a0c10;
      --bg-surface: #12151c;
      --bg-surface-elevated: #181c25;
      --bg-surface-glass: rgba(18, 21, 28, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;

      --accent-primary: #0ea5e9;
      --accent-light: #38bdf8;
      --accent-glow: rgba(14, 165, 233, 0.25);
      --accent-tint: rgba(14, 165, 233, 0.12);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 18px 44px -4px rgba(0, 0, 0, 0.5);
      --shadow-card: 0 12px 32px -4px rgba(0, 0, 0, 0.4);
      --shadow-pop: 0 28px 56px -10px rgba(0, 0, 0, 0.65);
    }

    /* Requirement 6: Global non-selectable text enforcement */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Only changelog body content is allowed to be selected and copied */
    .selectable-text,
    .selectable-text *,
    #changelog-list,
    .changelog-item span {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.4s var(--ease-spring), color 0.4s var(--ease-spring);
      position: relative;
    }

    /* Ambient background glow */
    .bg-glow {
      position: fixed;
      top: -15vw;
      right: -10vw;
      width: 55vw;
      height: 55vw;
      max-width: 800px;
      max-height: 800px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(2, 132, 199, 0) 70%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.8;
      transition: opacity 0.4s var(--ease-spring);
    }

    /* Requirement 2: Deprecated separate blur mask in favor of App-style content mask */
    .top-blur-mask {
      display: none !important;
    }

    /* =========================================================
       Native App-style Scroll Viewport & Content Mask Architecture
       (Directly mirroring src/App.tsx line 1348-1354 dock mask pattern:
        The content itself dissolves to transparent before the navbar edge,
        leaving the navbar completely untouched and 100% razor sharp)
       ========================================================= */
    .page-scroll-viewport {
      width: 100%;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      box-sizing: border-box;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        transparent var(--navbar-top, 16px),
        black calc(var(--navbar-top, 16px) + 60px),
        black 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        transparent var(--navbar-top, 16px),
        black calc(var(--navbar-top, 16px) + 60px),
        black 100%
      );
    }

    /* Scrollbar refinements */
    .page-scroll-viewport::-webkit-scrollbar {
      width: 6px;
    }
    .page-scroll-viewport::-webkit-scrollbar-track {
      background: transparent;
    }
    .page-scroll-viewport::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 9999px;
    }

    /* Inner Page Container: Pinned with safe breathing margin below navbar */
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: calc(var(--navbar-top, 16px) + 60px + 16px) 20px 48px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Cascade Reveal Animation */
    .cascade-item {
      opacity: 0;
      transform: translateY(22px) scale(0.985);
      animation: cascadeReveal 0.8s var(--ease-spring) forwards;
      animation-delay: calc(var(--delay, 0) * 75ms);
    }

    @keyframes cascadeReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Staggered in-panel waterfall animation */
    @keyframes panelWaterfallIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .stagger-in {
      opacity: 0;
      transform: translateY(18px) scale(0.985);
      animation: panelWaterfallIn 0.65s var(--ease-spring) both;
      animation-delay: calc(var(--stagger, 0) * 35ms);
      will-change: transform, opacity;
    }

    /* Silky i18n waterfall & breathing transitions */
    .i18n-translatable {
      transition: opacity 0.2s var(--ease-spring), transform 0.2s var(--ease-spring);
    }

    .cascade-fading {
      opacity: 0 !important;
      transform: translateY(-10px) scale(0.99) !important;
      transition: opacity 0.18s var(--ease-spring), transform 0.18s var(--ease-spring) !important;
    }

    .panel-fading-out {
      opacity: 0 !important;
      transform: translateY(-8px) scale(0.99) !important;
      transition: opacity 0.18s var(--ease-spring), transform 0.18s var(--ease-spring) !important;
    }

    /* =========================================================
       Top Navigation Bar (Concentric 10px edge alignment)
       ========================================================= */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 10px;
      background: var(--bg-surface-glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: 9999px;
      /* Capsule Navbar */
      box-shadow: var(--shadow-sm);
      position: fixed;
      top: var(--navbar-top, 16px);
      left: 20px;
      right: 20px;
      max-width: 1160px;
      margin: 0 auto;
      z-index: 100;
      transition: all 0.35s var(--ease-spring);
      box-sizing: border-box;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
      flex-shrink: 0;
      min-width: max-content;
    }

    .brand-logo-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.25s var(--ease-spring), border-color 0.25s ease;
    }

    .brand:hover .brand-logo-wrap {
      transform: scale(1.08) rotate(-2deg);
      border-color: var(--accent-primary);
    }

    .brand-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Requirement 7: “合拍”永远横向，坚决不被压成竖向 */
    .brand-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--accent-tint);
      color: var(--accent-primary);
      padding: 3px 10px;
      border-radius: 9999px;
      /* Pill */
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Segmented Language Slider (Desktop / Wide screen) */
    .lang-slider {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg-surface-elevated);
      border-radius: 9999px;
      /* Capsule */
      padding: 3px;
      border: 1px solid var(--border-subtle);
      height: 36px;
      box-sizing: border-box;
    }

    .lang-pill {
      position: absolute;
      top: 3px;
      bottom: 3px;
      border-radius: 9999px;
      /* Capsule pill */
      background: var(--bg-surface);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: left 0.35s var(--ease-spring), width 0.35s var(--ease-spring);
      pointer-events: none;
    }

    .lang-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 0 12px;
      height: 100%;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 9999px;
      transition: color 0.2s ease;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .lang-btn:hover {
      color: var(--text-primary);
    }

    .lang-btn.active {
      color: var(--accent-primary);
    }

    /* Sub-pixel baseline calibration: shift Chinese up by 1px */
    .lang-btn[data-lang="zh"],
    #lang-dropdown-current[data-lang="zh"],
    .lang-dropdown-item[data-lang="zh"] span {
      transform: translateY(-1px);
    }

    /* Custom Capsule Dropdown (Narrow Screen) */
    .lang-dropdown {
      display: none;
      position: relative;
      align-items: center;
      height: 36px;
      box-sizing: border-box;
    }

    .lang-dropdown-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 0 14px 0 16px;
      height: 36px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      outline: none;
      transition: all 0.25s var(--ease-spring);
      box-sizing: border-box;
      white-space: nowrap;
    }

    .lang-dropdown-trigger:hover {
      border-color: var(--border-glass);
      background: var(--bg-surface);
    }

    .lang-dropdown.open .lang-dropdown-trigger {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .lang-dropdown-arrow {
      width: 12px;
      height: 12px;
      stroke: var(--text-secondary);
      transition: transform 0.25s var(--ease-spring);
      flex-shrink: 0;
    }

    .lang-dropdown.open .lang-dropdown-arrow {
      transform: rotate(180deg);
    }

    /* Elegant Rounded Glassmorphic Menu Panel */
    .lang-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 104px;
      min-width: unset;
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 5px;
      box-shadow: var(--shadow-pop);
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.22s var(--ease-spring), transform 0.22s var(--ease-spring);
      transform-origin: top right;
    }

    [data-theme="light"] .lang-dropdown-menu {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
    }

    [data-theme="dark"] .lang-dropdown-menu {
      background: rgba(18, 21, 28, 0.96);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
    }

    .lang-dropdown.open .lang-dropdown-menu {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .lang-dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }

    .lang-dropdown-item:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    .lang-dropdown-item.active {
      color: var(--accent-primary);
      background: var(--accent-tint);
    }

    .lang-dropdown-item .item-check {
      opacity: 0;
      transition: opacity 0.18s ease;
      color: var(--accent-primary);
    }

    .lang-dropdown-item.active .item-check {
      opacity: 1;
    }

    /* Smart compact mode for narrow viewports: hides brand badge to prevent overflow */
    .navbar.compact-navbar .brand-badge {
      display: none !important;
    }

    @media (max-width: 580px) {
      .navbar {
        left: 12px;
        right: 12px;
        padding: 10px 10px;
        gap: 10px;
      }

      .page-container {
        padding: calc(var(--navbar-top, 16px) + 60px + 12px) 16px 48px;
      }

      /* Logo and brand maintain standard dimensions without height compression */
      .brand-logo-wrap {
        width: 38px;
        height: 38px;
      }

      .brand-name {
        font-size: 1.2rem;
      }

      .lang-slider {
        display: none;
      }

      .lang-dropdown {
        display: flex;
      }
    }

    @media (max-width: 420px) {
      .navbar {
        gap: 6px;
      }
      .brand {
        gap: 8px;
      }
      .nav-controls {
        gap: 6px;
      }
      .brand-badge {
        display: none !important;
      }
    }

    /* Theme Switcher Button (Circle) */
    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      /* Circular */
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s var(--ease-spring);
      flex-shrink: 0;
    }

    .theme-btn:active {
      transform: scale(0.9);
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.4s var(--ease-spring);
    }

    [data-theme="dark"] .icon-sun {
      display: block;
    }

    [data-theme="dark"] .icon-moon {
      display: none;
    }

    [data-theme="light"] .icon-sun {
      display: none;
    }

    [data-theme="light"] .icon-moon {
      display: block;
    }

    /* Hero Section */
    .hero-section {
      margin-top: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.4s var(--ease-spring);
    }

    .hero-badge-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* Requirement 3: Multi-language Version Tag */
    .version-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      /* Pill */
      background: var(--accent-tint);
      border: 1px solid rgba(2, 132, 199, 0.2);
      color: var(--accent-primary);
      font-size: 0.88rem;
      font-weight: 600;
      font-family: var(--font-mono);
      text-align: center;
    }

    .version-tag::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 10px #10b981;
    }

    .hero-title {
      font-size: clamp(2.1rem, 5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.25;
      color: var(--text-primary);
      max-width: 26ch;
      margin-bottom: 24px;
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-title .title-chunk {
      display: inline-block;
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      .hero-title {
        font-size: clamp(1.8rem, 7.8vw, 2.25rem);
        line-height: 1.28;
      }
      .hero-title .hero-break-wide {
        display: none;
      }
      .hero-title .title-chunk {
        display: block;
        margin: 2px 0;
      }
    }

    .text-accent {
      color: var(--accent-primary);
      font-weight: 700;
    }

    /* Feature Capsule Tags */
    .feature-capsules-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
      max-width: 720px;
    }

    .capsule-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .feature-capsules-wrap {
      position: relative;
    }

    .feature-capsule {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 18px;
      border-radius: 9999px;
      /* Pill */
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: all 0.25s var(--ease-spring);
      text-align: center;
      position: relative;
      overflow: hidden;
      cursor: default;
    }

    /* Requirement 1: Pulsing bottom-inner progress bar, masked by capsule frame at curve boundaries */
    .feature-capsule::after {
      content: '';
      position: absolute;
      bottom: 0px;
      left: 0;
      right: 0;
      height: 2px;
      transform-origin: left center;
      transform: scaleX(0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    @keyframes chipPulseSweep {
      0% {
        transform: scaleX(0);
        opacity: 0;
        background: #ffffff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
      }
      15% {
        opacity: 1;
        background: #ffffff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
      }
      50% {
        opacity: 1;
        background: #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.85);
      }
      80% {
        transform: scaleX(1);
        opacity: 1;
        background: var(--accent-primary);
        box-shadow: 0 0 12px var(--accent-glow);
      }
      100% {
        transform: scaleX(1);
        opacity: 0;
        background: var(--accent-primary);
        box-shadow: 0 0 12px var(--accent-glow);
      }
    }

    .feature-capsule.pulse-active::after {
      animation: chipPulseSweep 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Interruptible: when hovering any capsule or when container is interrupted, immediately fade out and stop */
    .feature-capsule:hover::after,
    .feature-capsule:focus-visible::after,
    .feature-capsules-wrap.is-interrupted .feature-capsule::after {
      opacity: 0 !important;
      animation: none !important;
      transition: opacity 0.2s ease !important;
    }

    .feature-capsule:hover {
      background: var(--bg-surface);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Requirement 4: Action Buttons Row with identical standardized height (46px) */
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      animation: btnBreathingGlow 3.2s ease-in-out infinite;

    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);

      border-color: var(--border-glass);
      transform: translateY(-2px);

       ========================================================= */

      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 32px;

      padding: 34px 38px;
      box-shadow: var(--shadow-card);
      margin-bottom: 56px;
      text-align: left;
      contain: layout style;
      transition: opacity 0.35s var(--ease-spring), transform 0.35s var(--ease-spring);
    }

      .main-display-card {
        padding: 24px 18px;
        border-radius: 24px;
      }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);

      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;

    /* Changelog List */
    .changelog-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .changelog-item {
      font-size: 0.98rem;
      color: var(--text-secondary);

      display: flex;
      align-items: center;
      gap: 12px;

      font-weight: 700;

      align-items: center;
      justify-content: center;
      text-align: center;

      color: #10b981;
    }

    .tag-refactor {
      background: rgba(14, 165, 233, 0.12);
      color: #0284c7;
    }

    .tag-opt {
      background: rgba(245, 158, 11, 0.12);
      color: #f59e0b;
    }

    .tag-fix {
      background: rgba(139, 92, 246, 0.12);
      color: #8b5cf6;
    }

    /* =========================================================
       Requirement 5: Core Features & Compatibility Matrix (Bento Layout)
       ========================================================= */
    .features-compat-view {
      display: none;
    }

    .features-compat-view.active {
      display: block;
    }

    .features-compat-view .head-chunk {
      display: inline;
    }

    .features-badge {

      font-family: var(--font-mono);

      flex-shrink: 0;

    .features-badge .badge-dot {
      display: inline;

        display: block;
        line-height: 1.25;
      }
      .features-badge .badge-dot {
        display: none;
      }
      .features-badge .badge-chunk {
        display: block;
        line-height: 1.25;
      }

      display: block;
      line-height: 1.25;
    }

    body.is-compact .features-badge .badge-dot,

      display: none;
    }

    body.is-compact .features-badge .badge-chunk,

      line-height: 1.25;
    }

    .features-grid {

      margin-bottom: 40px;

    /* Compatibility Tables */
    .section-subhead {

      font-weight: 700;
      color: var(--text-primary);
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;

    .table-container {

      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      background: var(--bg-surface-elevated);
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);

      scrollbar-color: var(--border-subtle) transparent;

    .table-container::-webkit-scrollbar {
      height: 5px;

    .table-container::-webkit-scrollbar-track {
      background: transparent;
      margin: 0 24px; /* Strictly restrict scrollbar track within bottom straight section */
    }

    .table-container::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 9999px;
    }

    .table-container::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }

    .compat-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
      min-width: 620px;
    }

    .compat-table th,
    .compat-table td {

    .compat-table th {

    [data-theme="dark"] .compat-table th {
      background: rgba(255, 255, 255, 0.02);

    .compat-table tr:last-child td {
      border-bottom: none;
    }

    .badge-status {

      align-items: center;
      justify-content: center;
      gap: 5px;

</head>

    // 2. Language Slider & Localization Engine
    // (Requirement 1: Silky waterfall + breathing animation)
    // ==========================================
    function updateLangPillPosition(btn) {
      if (!btn || !langSlider || !langPill) return;
      const rect = btn.getBoundingClientRect();
      const parentRect = langSlider.getBoundingClientRect();
      langPill.style.left = (rect.left - parentRect.left) + 'px';
      langPill.style.width = rect.width + 'px';
    }

    // Lucide Icons for 10 Core Features
    const FEATURE_ICONS = [
      // 1: Controls (Play)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>',
      // 2: Lyrics (Music)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>',
      // 3: Playback Mode (Repeat)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>',
      // 4: Custom Audio Sources (PlusCircle)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>',
      // 5: Ambient Glow (Sparkles)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>',
      // 6: Cold-Start Auto-Resume (Zap)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
      // 7: Mainstream IM Messaging Bridge (MessageSquare)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>',
      // 8: Silent Update Checks (RefreshCw)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>',
      // 9: Dark/Light Theme & Multi-Language (Globe)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>',
      // 10: Local Privacy & Zero Telemetry (ShieldCheck)
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>'
    ];

    // Helper: Format status badge using crisp Lucide SVG check icons instead of emojis
    function formatStatusBadge(rawText) {
      if (!rawText) return '';
      const clean = rawText.replace(/✅\s*/g, '').trim();
      const isPartial = clean.includes('OriginOS') || clean.includes('仅') || clean.includes('Nur') || clean.includes('限定') || clean.includes('视') || clean.includes('specific') || clean.includes('abhängig') || clean.includes('依存');
      const badgeClass = isPartial ? 'status-partial' : 'status-full';
      const checkSvg = !isPartial
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
        : '';
      return `<span class="badge-status ${badgeClass}">${checkSvg}<span>${clean}</span></span>`;
    }

    function renderLanguageContent(lang) {
      const dict = I18N[lang] || I18N.zh;

      // Hero Tag (Requirement 3)
      document.getElementById('txt-version-tag').textContent = dict.tagRelease;

      // Hero Title
      document.getElementById('txt-hero-title').innerHTML = dict.heroTitle;

      // Feature Chips
      dict.chips.forEach((text, i) => {
        const el = document.getElementById('chip-' + (i + 1));
        if (el) el.textContent = text;
      });

      // Action Buttons (Requirement 4 & 5)
      document.getElementById('txt-btn-download').textContent = dict.btnDownload;
      txtBtnToggle.textContent = (currentView === 'changelog') ? dict.btnToggleToFeatures : dict.btnToggleToChangelog;

      // Changelog Head
      document.getElementById('txt-changelog-head').textContent = dict.changelogHead;

      // Render Changelog List (strictly without trailing punctuation)
      const changelogList = document.getElementById('changelog-list');
      changelogList.innerHTML = dict.changelog.map((item, idx) => `
        <li class="changelog-item">
          <span class="tag-type ${item.tagClass}">${item.type}</span>
          <span>${item.text}</span>
        </li>
      `).join('');

      // Features & Compatibility Card (Requirement 5)
      document.getElementById('txt-features-head').innerHTML = dict.featuresHead;
      document.getElementById('txt-compat-preset-title').textContent = dict.compatPresetTitle;

      // Table Headers
      document.getElementById('th-app').textContent = dict.thApp;
      document.getElementById('th-ctrl').textContent = dict.thCtrl;
      document.getElementById('th-lyric').textContent = dict.thLyric;
      document.getElementById('th-mode').textContent = dict.thMode;
      document.getElementById('th-note').textContent = dict.thNote;

      // Render 10 Core Features Bento Cards with Lucide Icons
      const featuresGrid = document.getElementById('features-grid');
      featuresGrid.innerHTML = dict.features.map((f, i) => `
        <div class="feature-card">
          <div class="feature-card-header">
            <span class="feature-icon-badge">${FEATURE_ICONS[i] || (i + 1)}</span>
            <span>${f.title}</span>
          </div>
          <p class="feature-card-desc">${f.desc}</p>
        </div>
      `).join('');

      // Render Preset Compat Table with Lucide SVG status badges
      const presetTbody = document.getElementById('compat-preset-tbody');
      presetTbody.innerHTML = dict.presetCompat.map(row => `
        <tr>
          <td><strong>${row.app}</strong></td>
          <td>${formatStatusBadge(row.ctrl)}</td>
          <td>${formatStatusBadge(row.lyric)}</td>
          <td>${formatStatusBadge(row.mode)}</td>
          <td style="color:var(--text-secondary);">${row.note}</td>
        </tr>
      `).join('');

      // Footer Links
      document.getElementById('txt-footer-repo').textContent = dict.footerRepo;
      document.getElementById('txt-footer-privacy').textContent = dict.footerPrivacy;
      document.getElementById('txt-footer-issues').textContent = dict.footerIssues;
    }

    let isLangSwitching = false;
    function applyLanguage(lang, withCascade = true) {
      if (!withCascade) {
        currentLang = lang;
        renderLanguageContent(lang);
        return;
      }
      if (isLangSwitching) return;
      isLangSwitching = true;

      // Smooth waterfall & fade-out stage for all page content below navbar
      const waterfallTargets = document.querySelectorAll('.hero-section .cascade-item, footer.cascade-item');
      waterfallTargets.forEach(el => el.classList.add('cascade-fading'));

      setTimeout(() => {
        currentLang = lang;
        renderLanguageContent(lang);

        // Staggered cascade reveal with fresh reflow (identical to initial page load experience)
        waterfallTargets.forEach((el, idx) => {
          el.classList.remove('cascade-fading');
          el.style.animation = 'none';
          void el.offsetWidth; // Force reflow
          const delay = el.style.getPropertyValue('--delay') || (idx + 2);
          el.style.animation = 'cascadeReveal 0.8s var(--ease-spring) forwards';
          el.style.animationDelay = `calc(${delay} * 75ms)`;
        });

        // Release mutex lock once animation is safely initiated
        setTimeout(() => {
          isLangSwitching = false;
        }, 150);
      }, 190);
    }

    // Language labels mapping
    const LANG_LABELS = { zh: '中文', en: 'EN', de: 'DE', ja: 'JA' };

    function syncLangDropdown(lang) {
      if (langDropdownCurrent) {
        langDropdownCurrent.textContent = LANG_LABELS[lang] || lang.toUpperCase();
        langDropdownCurrent.setAttribute('data-lang', lang);
      }
      langDropdownItems.forEach(item => {
        item.classList.toggle('active', item.getAttribute('data-lang') === lang);
      });
      checkNavbarFit();
    }

    // Custom Dropdown Trigger
    if (langDropdownTrigger) {
      langDropdownTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = langDropdown.classList.toggle('open');
        langDropdownTrigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      document.addEventListener('click', (e) => {
        if (langDropdown && !langDropdown.contains(e.target)) {
          langDropdown.classList.remove('open');
          langDropdownTrigger.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // Custom Dropdown Items
    langDropdownItems.forEach(item => {
      item.addEventListener('click', () => {
        const lang = item.getAttribute('data-lang');
        if (langDropdown) langDropdown.classList.remove('open');
        if (langDropdownTrigger) langDropdownTrigger.setAttribute('aria-expanded', 'false');
        if (lang === currentLang || isLangSwitching) return;

        // Sync Desktop Slider
        const matchingBtn = document.querySelector(`.lang-btn[data-lang="${lang}"]`);
        if (matchingBtn) {
          langBtns.forEach(b => b.classList.toggle('active', b === matchingBtn));
          updateLangPillPosition(matchingBtn);
        }
        syncLangDropdown(lang);
        applyLanguage(lang, true);
      });
    });

    // Slider Buttons
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.getAttribute('data-lang');
        if (lang === currentLang || isLangSwitching) return;
        langBtns.forEach(b => b.classList.toggle('active', b === btn));
        syncLangDropdown(lang);
        updateLangPillPosition(btn);
        applyLanguage(lang, true);
      });
    });

    // Smart Navbar & Layout Fitting: Ensure elements adapt smoothly on narrow viewports
    function checkNavbarFit() {
      if (!navbar || !themeBtn) return;
      navbar.classList.remove('compact-navbar');
      document.body.classList.remove('is-compact');
      const navRect = navbar.getBoundingClientRect();
      const themeRect = themeBtn.getBoundingClientRect();
      if (themeRect.right > navRect.right - 9.5) {
        navbar.classList.add('compact-navbar');
        document.body.classList.add('is-compact');
      }
      checkFeaturesHeaderFit();
    }

    function checkFeaturesHeaderFit() {
      const header = document.getElementById('features-card-header');
      if (!header) return;
      header.classList.remove('compact-header');
      if (header.offsetWidth > 0 && header.offsetWidth < 440) {
        header.classList.add('compact-header');
      }
    }

    // Throttled Window Resize Observer
    let resizeRaf = null;
    window.addEventListener('resize', () => {
      if (resizeRaf) return;
      resizeRaf = requestAnimationFrame(() => {
        resizeRaf = null;
        const activeBtn = document.querySelector('.lang-btn.active');
        if (activeBtn) updateLangPillPosition(activeBtn);
        checkNavbarFit();
      });
    });

    if (window.ResizeObserver && navbar) {
      new ResizeObserver(() => checkNavbarFit()).observe(navbar);
      const featHeader = document.getElementById('features-card-header');
      if (featHeader) new ResizeObserver(() => checkFeaturesHeaderFit()).observe(featHeader);
    }

    // ==========================================
    // 3. View Switcher: Changelog vs Features & Compat
    // (Requirement 4: Smooth button width easing & staggered waterfall panel loading)
    // ==========================================
    function triggerFeaturesWaterfall() {
      checkFeaturesHeaderFit();
      const header = viewFeaturesCompat.querySelector('.card-header');
      const cards = viewFeaturesCompat.querySelectorAll('.feature-card');
      const subhead = viewFeaturesCompat.querySelector('.section-subhead');
      const table = viewFeaturesCompat.querySelector('.table-container');

      const elements = [header, ...cards, subhead, table].filter(Boolean);
      elements.forEach((el, idx) => {
        el.classList.remove('stagger-in');
        el.style.animation = 'none';
        el.style.setProperty('--stagger', idx);
      });
      void viewFeaturesCompat.offsetWidth;
      elements.forEach(el => {
        el.style.animation = '';
        el.classList.add('stagger-in');
      });
    }

    function triggerChangelogWaterfall() {
      const header = viewChangelog.querySelector('.card-header');
      const items = viewChangelog.querySelectorAll('.changelog-item');

      const elements = [header, ...items].filter(Boolean);
      elements.forEach((el, idx) => {
        el.classList.remove('stagger-in');
        el.style.animation = 'none';
        el.style.setProperty('--stagger', idx);
      });
      void viewChangelog.offsetWidth;
      elements.forEach(el => {
        el.style.animation = '';
        el.classList.add('stagger-in');
      });
    }

    let isToggling = false;
    btnToggleView.addEventListener('click', () => {
      if (isToggling) return;
      isToggling = true;

      const dict = I18N[currentLang] || I18N.zh;
      const targetView = (currentView === 'changelog') ? 'features' : 'changelog';
      const targetText = (targetView === 'changelog') ? dict.btnToggleToFeatures : dict.btnToggleToChangelog;
      const targetIcon = (targetView === 'changelog')
        ? '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>'
        : '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>';

      // 1. Measure starting width of capsule button
      const startWidth = btnToggleView.getBoundingClientRect().width;
      btnToggleView.style.width = startWidth + 'px';

      // 2. Fade out button text and icon
      const morphInner = document.getElementById('btn-toggle-inner');
      morphInner.classList.add('morph-fading');

      // 3. Fade out currently active panel view
      const activeViewEl = (currentView === 'changelog') ? viewChangelog : viewFeaturesCompat;
      activeViewEl.classList.add('panel-fading-out');

      // 4. Staggered transition
      setTimeout(() => {
        // Resolve latest language dictionary dynamically to eliminate cross-language race condition
        const freshDict = I18N[currentLang] || I18N.zh;
        txtBtnToggle.textContent = (targetView === 'changelog') ? freshDict.btnToggleToFeatures : freshDict.btnToggleToChangelog;
        iconToggle.innerHTML = targetIcon;

        // Measure target button width
        btnToggleView.style.width = 'auto';
        const targetWidth = btnToggleView.getBoundingClientRect().width;
        btnToggleView.style.width = startWidth + 'px';
        void btnToggleView.offsetWidth; // Force reflow
        btnToggleView.style.width = targetWidth + 'px'; // Smooth spring easing width morph

        // Fade button text/icon in
        morphInner.classList.remove('morph-fading');

        // Switch panels with waterfall entrance
        currentView = targetView;
        if (currentView === 'features') {
          viewChangelog.style.display = 'none';
          viewChangelog.classList.remove('panel-fading-out');
          viewFeaturesCompat.style.display = 'block';
          viewFeaturesCompat.classList.remove('panel-fading-out');
          triggerFeaturesWaterfall();
        } else {
          viewFeaturesCompat.style.display = 'none';
          viewFeaturesCompat.classList.remove('panel-fading-out');
          viewChangelog.style.display = 'block';
          viewChangelog.classList.remove('panel-fading-out');
          triggerChangelogWaterfall();
        }

        // Clean up explicit width after easing completes
        setTimeout(() => {
          btnToggleView.style.width = '';
          isToggling = false;
        }, 450);
      }, 200);
    });

    // Initial Execution
    setTimeout(() => {
      const activeBtn = document.querySelector('.lang-btn.active');
      if (activeBtn) updateLangPillPosition(activeBtn);
      syncLangDropdown('zh');
      applyLanguage('zh', false);
    }, 50);

    // ==========================================
    // 4. Feature Capsules Sequential Pulse Engine
    // (Requirement 3: Sequential bottom-border pulse sweep, interruptible)
    // ==========================================
    const chipsWrap = document.querySelector('.feature-capsules-wrap');
    const chips = Array.from(document.querySelectorAll('.feature-capsule'));
    let currentPulseIdx = 0;
    let pulseTimer = null;
    let isPulseInterrupted = false;
    let pulseGeneration = 0;

    function stopAllPulses() {
      pulseGeneration++;
      if (pulseTimer) {
        clearTimeout(pulseTimer);
        pulseTimer = null;
      }
      chips.forEach(c => c.classList.remove('pulse-active'));
    }

    function runNextPulse() {
      if (isPulseInterrupted || chips.length === 0) return;

      stopAllPulses();
      const currentToken = ++pulseGeneration;
      const chip = chips[currentPulseIdx];
      chip.classList.add('pulse-active');

      // Pulse sweep animation duration is 1150ms. Once finished, wait 200ms before triggering the next chip.
      pulseTimer = setTimeout(() => {
        if (currentToken !== pulseGeneration || isPulseInterrupted) return;
        chip.classList.remove('pulse-active');
        currentPulseIdx = (currentPulseIdx + 1) % chips.length;

        pulseTimer = setTimeout(() => {
          if (currentToken !== pulseGeneration || isPulseInterrupted) return;
          runNextPulse();
        }, 200);
      }, 1150);
    }

    if (chipsWrap && chips.length > 0) {
      // Start sequential pulse after initial cascade entrance finishes (~1.2s)
      setTimeout(runNextPulse, 1200);

      const handleInterrupt = () => {
        isPulseInterrupted = true;
        chipsWrap.classList.add('is-interrupted');
        stopAllPulses();
      };

      const handleResume = () => {
        isPulseInterrupted = false;
        chipsWrap.classList.remove('is-interrupted');
        if (pulseTimer) clearTimeout(pulseTimer);
        pulseTimer = setTimeout(runNextPulse, 200);
      };

      chipsWrap.addEventListener('mouseenter', handleInterrupt);
      chipsWrap.addEventListener('mouseleave', handleResume);
      chipsWrap.addEventListener('focusin', handleInterrupt);
      chipsWrap.addEventListener('focusout', handleResume);
      chipsWrap.addEventListener('touchstart', handleInterrupt, { passive: true });
      chipsWrap.addEventListener('touchend', handleResume, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) handleInterrupt();
        else handleResume();
      });
    }
  </script>
